<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>链上预测市场 × 大宗商品盘口追踪</title>
  <meta name="description" content="Polymarket 商品盘口隐含概率 vs 标的物真实价格,叠加追踪。" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <h1>大宗商品盘口追踪</h1>
        <p class="subtitle">链上预测市场隐含概率 × 标的物真实价格 · 叠加对比</p>
      </div>
      <div class="meta">
        <div id="updated" class="updated">—</div>
        <div class="sources">
          <span class="badge badge-accent">Polymarket · Gamma + CLOB</span>
          <span class="badge">价格 · Yahoo Finance</span>
          <button id="theme-toggle" class="badge badge-btn" title="切换深浅色">◐ 主题</button>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="controls">
      <div class="control-group">
        <span class="control-label">时间范围</span>
        <div id="range-buttons" class="btn-row">
          <button class="chip" data-range="30">30天</button>
          <button class="chip active" data-range="90">90天</button>
          <button class="chip" data-range="0">全部</button>
        </div>
      </div>
      <div class="control-group">
        <span class="control-label">商品</span>
        <div id="commodity-buttons" class="btn-row"></div>
      </div>
    </section>

    <section id="grid" class="grid"><div class="loading">加载数据中…</div></section>

    <footer class="pagefoot">
      <p>数据由 GitHub Actions 每日自动刷新并烘焙为静态 <code>data.json</code>,本页纯静态渲染。</p>
      <p class="disclaimer">仅供研究参考,非投资建议。概率来自预测市场盘口,价格来自公开行情源。</p>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
