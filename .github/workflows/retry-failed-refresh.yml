name: Retry failed Refresh & Deploy

# GitHub Pages 的部署后端偶发瞬时故障("Deployment failed, try again later."),
# 与我们的代码/配置无关(build 阶段——抓数据/提交/打包——每次都成功,只有
# deploy 这一步有概率失败)。这里监听 Refresh & Deploy 的完成事件,失败时
# 自动只重跑失败的 job(通常就是 deploy),不重新抓数据。
# 只用 GitHub 官方 gh CLI,不引入任何第三方 action。
on:
  workflow_run:
    workflows: ["Refresh & Deploy"]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun-failed:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Wait briefly before retrying
        run: sleep 20

      - name: Rerun failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run rerun "${{ github.event.workflow_run.id }}" \
            --repo "${{ github.repository }}" \
            --failed
